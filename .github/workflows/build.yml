# Builds VokoAvalonia.exe on GitHub's servers every time code is pushed.
# Download it from the "Actions" tab: open the latest run, then "Artifacts".
# Pushing a tag like v0.1.0 also creates a GitHub Release with the zip attached.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build one-file .exe
        run: >
          dotnet publish src/VokoAvalonia.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Add ffmpeg (records the screen)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/*/bin/ffmpeg.exe out/
          Remove-Item out/*.pdb -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v6
        with:
          name: VokoAvalonia-windows-x64
          path: out/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath VokoAvalonia-windows-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: VokoAvalonia-windows-x64.zip
